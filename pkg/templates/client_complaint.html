<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File a Complaint - Kiraar</title>
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/main.css">
</head>
<body class="inner-page">
    <div class="container py-5" style="max-width: 720px;">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <h2 class="fw-bold mb-3" style="color:#611f47;">File a Complaint</h2>
                <p class="text-muted">Let us know what went wrong with booking #{{ booking.booking_id }}.</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                        <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} rounded-3">
                            {{ message }}
                        </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subject</label>
                        <input type="text" class="form-control" name="subject" placeholder="e.g. Service quality issue" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Message</label>
                        <textarea class="form-control" name="message" rows="6" placeholder="Describe the issue in detail..." required></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger rounded-pill">Submit Complaint</button>
                        <a href="{{ url_for('client_bookings') }}" class="btn btn-outline-secondary rounded-pill">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
