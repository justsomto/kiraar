<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Kiraar</title>
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/main.css">
</head>
<body>
    <div class="container py-5 my-5 d-flex justify-content-center align-items-center">
        <div class="col-11 col-sm-9 col-md-6 col-lg-5 p-4 p-sm-5 kiraar-auth-card shadow-sm">

            <div class="text-center mb-4">
                <div class="mb-3">
                    <i class="fa-solid fa-key" style="font-size: 2.5rem; color: #611f47;"></i>
                </div>
                <h2 class="fw-bold">Set New Password</h2>
                <p class="text-secondary">Please enter your new password below.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show kiraar-flash" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/reset-password/{{ token }}/" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">New Password</label>
                    <input type="password" name="password" minlength="8" class="form-control py-2" placeholder="Minimum 8 characters" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirm New Password</label>
                    <input type="password" name="confirm_password" minlength="8" class="form-control py-2" placeholder="Re-enter new password" required>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-lg py-2 text-white kiraar-btn-solid">
                        <i class="fa-solid fa-check-circle me-2"></i>Update Password
                    </button>
                </div>
            </form>

            <p class="text-center text-secondary mb-0">
                Back to <a href="/login/" class="text-decoration-none kiraar-legal-link fw-semibold">Log In</a>
            </p>

        </div>
    </div>

    <script src="/static/jquery.js"></script>
    <script src="/static/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        setTimeout(function() {
            $('.kiraar-flash').fadeOut('slow', function() { $(this).remove(); });
        }, 6000);
    </script>
</body>
</html>
